<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 운세 생성기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f3ff;
      --card: rgba(255, 255, 255, 0.85);
      --text: #222;
      --sub: #666;
      --primary: #7c3aed;
      --secondary: #f472b6;
      --border: rgba(124, 58, 237, 0.18);
      --shadow: 0 20px 50px rgba(80, 50, 150, 0.18);
    }

    body.dark {
      --bg: #111827;
      --card: rgba(31, 41, 55, 0.92);
      --text: #f9fafb;
      --sub: #cbd5e1;
      --primary: #a78bfa;
      --secondary: #f9a8d4;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(244, 114, 182, 0.3), transparent 35%),
        radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.28), transparent 35%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: 0.3s;
    }

    .container {
      width: 100%;
      max-width: 880px;
    }

    .hero {
      text-align: center;
      margin-bottom: 24px;
      animation: fadeUp 0.7s ease;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .hero p {
      color: var(--sub);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: fadeUp 0.9s ease;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: 800;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.25);
    }

    .main-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }

    .mode-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result {
      display: none;
      animation: pop 0.5s ease;
    }

    .result.show {
      display: block;
    }

    .today-message {
      text-align: center;
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(244, 114, 182, 0.12));
      margin-bottom: 22px;
    }

    .today-message .emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .today-message h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .fortune-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .fortune-item {
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }

    body.dark .fortune-item {
      background: rgba(255, 255, 255, 0.06);
    }

    .fortune-item:hover {
      transform: translateY(-4px);
    }

    .fortune-item h3 {
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .stars {
      color: #facc15;
      font-size: 1.1rem;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .fortune-item p {
      color: var(--sub);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      color: var(--sub);
      font-size: 0.85rem;
      margin-top: 18px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 20px;
        border-radius: 22px;
      }

      .fortune-grid {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="badge">✨ Vibe Coding Assignment</div>
      <h1>오늘의 운세 생성기</h1>
      <p>
        버튼을 누르면 오늘의 총운, 연애운, 학업운, 금전운이 랜덤으로 나옵니다.<br />
        오늘 하루의 기분을 가볍게 확인해 보세요!
      </p>
    </section>

    <section class="card">
      <div class="top-actions">
        <button class="main-btn" onclick="generateFortune()">🔮 오늘의 운세 보기</button>
        <button class="mode-btn" onclick="toggleDarkMode()">🌙 다크모드</button>
      </div>

      <div id="result" class="result">
        <div class="today-message">
          <div id="mainEmoji" class="emoji">🍀</div>
          <h2 id="mainTitle">행운이 찾아오는 날!</h2>
          <p id="mainText">오늘은 생각보다 좋은 일이 생길 수 있어요.</p>
        </div>

        <div class="fortune-grid">
          <article class="fortune-item">
            <h3>🌈 총운</h3>
            <div id="totalStars" class="stars">★★★★★</div>
            <p id="totalText"></p>
          </article>

          <article class="fortune-item">
            <h3>💘 연애운</h3>
            <div id="loveStars" class="stars">★★★★★</div>
            <p id="loveText"></p>
          </article>

          <article class="fortune-item">
            <h3>📚 학업운</h3>
            <div id="studyStars" class="stars">★★★★★</div>
            <p id="studyText"></p>
          </article>

          <article class="fortune-item">
            <h3>💰 금전운</h3>
            <div id="moneyStars" class="stars">★★★★★</div>
            <p id="moneyText"></p>
          </article>
        </div>
      </div>

      <footer>
        HTML · CSS · JavaScript로 제작한 오늘의 운세 웹페이지
      </footer>
    </section>
  </main>

  <script>
    const mainFortunes = [
      {
        emoji: "🍀",
        title: "작은 행운이 따라오는 날!",
        text: "오늘은 사소한 선택이 좋은 결과로 이어질 수 있어요."
      },
      {
        emoji: "🌞",
        title: "기분 좋은 에너지가 가득한 날!",
        text: "밝은 태도로 시작하면 주변 사람들과의 흐름도 좋아질 거예요."
      },
      {
        emoji: "🚀",
        title: "도전하기 좋은 날!",
        text: "미뤄둔 일을 시작하기에 좋은 타이밍입니다."
      },
      {
        emoji: "🌙",
        title: "차분함이 필요한 날!",
        text: "급하게 결정하기보다 천천히 생각하면 더 좋은 선택을 할 수 있어요."
      },
      {
        emoji: "🎁",
        title: "뜻밖의 즐거움이 있는 날!",
        text: "예상하지 못한 소식이나 작은 선물이 기분을 좋게 만들 수 있어요."
      }
    ];

    const fortunes = {
      total: [
        "오늘은 전체적으로 무난하고 안정적인 하루예요.",
        "새로운 사람이나 기회가 찾아올 수 있어요.",
        "조금 피곤할 수 있지만 마무리는 괜찮을 거예요.",
        "계획한 일을 하나씩 처리하면 만족감이 클 거예요.",
        "괜히 기분 좋은 일이 생길 가능성이 있어요."
      ],
      love: [
        "가벼운 연락이 좋은 분위기로 이어질 수 있어요.",
        "솔직한 표현이 관계를 더 편하게 만들어 줄 거예요.",
        "상대의 말을 조금 더 들어주는 것이 좋아요.",
        "오늘은 무리한 고백보다 자연스러운 대화가 좋아요.",
        "작은 배려가 큰 호감으로 돌아올 수 있어요."
      ],
      study: [
        "짧게라도 집중하면 생각보다 많이 해낼 수 있어요.",
        "복습하기 좋은 날이에요. 어려웠던 개념이 조금 풀릴 수 있어요.",
        "새로운 내용을 시작하기보다 기존 내용을 정리하는 것이 좋아요.",
        "집중력이 올라오는 시간이 있으니 그때를 잘 활용하세요.",
        "오늘 공부한 내용은 시험 직전에 도움이 될 가능성이 높아요."
      ],
      money: [
        "충동구매만 조심하면 무난한 금전운이에요.",
        "작은 절약이 나중에 크게 느껴질 수 있어요.",
        "필요한 지출과 불필요한 지출을 구분하는 것이 좋아요.",
        "예상치 못한 간식비나 교통비 지출이 있을 수 있어요.",
        "돈을 쓰기보다 관리하기 좋은 날이에요."
      ]
    };

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function randomStars() {
      const count = Math.floor(Math.random() * 5) + 1;
      return "★".repeat(count) + "☆".repeat(5 - count);
    }

    function generateFortune() {
      const main = randomItem(mainFortunes);

      document.getElementById("mainEmoji").textContent = main.emoji;
      document.getElementById("mainTitle").textContent = main.title;
      document.getElementById("mainText").textContent = main.text;

      document.getElementById("totalStars").textContent = randomStars();
      document.getElementById("loveStars").textContent = randomStars();
      document.getElementById("studyStars").textContent = randomStars();
      document.getElementById("moneyStars").textContent = randomStars();

      document.getElementById("totalText").textContent = randomItem(fortunes.total);
      document.getElementById("loveText").textContent = randomItem(fortunes.love);
      document.getElementById("studyText").textContent = randomItem(fortunes.study);
      document.getElementById("moneyText").textContent = randomItem(fortunes.money);

      const result = document.getElementById("result");
      result.classList.remove("show");
      void result.offsetWidth;
      result.classList.add("show");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      const btn = document.querySelector(".mode-btn");
      btn.textContent = document.body.classList.contains("dark")
        ? "☀️ 라이트모드"
        : "🌙 다크모드";
    }
  </script>
</body>
</html>
